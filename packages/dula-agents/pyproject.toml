[project]
name = "dula-agents"
version = "0.1.0"
description = "Dula agent runtime: safe plan/act loop with permissioned tools, human approval, limits, and audit (ADR-0008)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dula-common",
    "dula-ai",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_agents"]
