[project]
name = "dula-plugins"
version = "0.1.0"
description = "Dula plugin/connector framework: signed manifests, sandboxed host, egress allowlist, connectors (Phase 07)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dula-common",
    "dula-ai",
    "pydantic>=2.9",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_plugins"]
