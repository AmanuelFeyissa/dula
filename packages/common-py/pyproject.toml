[project]
name = "dula-common"
version = "0.1.0"
description = "Shared Python utilities for Dula (config, logging, telemetry, OIDC auth)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "aiokafka>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_common"]
