[project]
name = "dula-automation"
version = "0.1.0"
description = "Dula security automation: declarative, approval-gated playbooks over the agent runtime + connectors, and grounded incident/exec reporting (Phase 08)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dula-common",
    "dula-agents",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_automation"]
