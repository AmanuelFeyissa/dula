[project]
name = "dula-ai"
version = "0.1.0"
description = "Dula AI subsystem: model-agnostic LLM Gateway + RAG engineering (not the Dula AI model)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dula-common",
    "pydantic>=2.9",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "opensearch-py>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_ai"]
