[project]
name = "dula-ml"
version = "0.1.0"
description = "Dula ML pipeline logic (torch-free): dataset prep, dedup, contamination, evaluation gate, registry."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_ml"]
