[project]
name = "dula-worker"
version = "0.1.0"
description = "Dula event worker — consumes domain events from Redpanda (ADR-0004)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dula-common",
    "aiokafka>=0.11",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_worker"]
