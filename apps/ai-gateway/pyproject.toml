[project]
name = "dula-ai-gateway"
version = "0.1.0"
description = "Dula AI Gateway service — grounded Q&A and alert triage over the RAG subsystem."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dula-common",
    "dula-ai",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dula_ai_gateway"]
