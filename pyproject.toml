# Dula monorepo — Python workspace root (uv).
# Individual Python packages/services live under packages/*, services/*, apps/*, ml/*
# and declare their own pyproject.toml; this root pins the toolchain and shared config.
# See docs/00-Governance/CodingStandards.md §2 and docs/01-Project/TechnologyStack.md.

[project]
name = "dula-workspace"
version = "0.0.0"
description = "Dula monorepo workspace root (tooling only)."
requires-python = ">=3.12,<3.13"

[tool.uv]
# uv workspace: member projects are added here as they are created (Phase 01+).
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.uv.workspace]
# Members are added as packages are created (each must have its own pyproject.toml).
members = [
    "packages/common-py",
    "packages/dula-ai",
    "packages/dula-ml",
    "packages/dula-agents",
    "packages/dula-plugins",
    "apps/platform-api",
    "apps/worker",
    "apps/ai-gateway",
]

[tool.uv.sources]
dula-common = { workspace = true }
dula-ai = { workspace = true }
dula-agents = { workspace = true }
dula-plugins = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "services", "apps", "ml", "tools"]

[tool.ruff.lint]
# Sensible, security-aware default set; expand per CodingStandards as code lands.
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
# ml/ is the standalone GPU runner project (not shipped platform code, not mypy-gated):
# runner docstrings carry copy-paste commands (E501) and human notation like "3B-7B"/"T4x2"
# (RUF002), and data shuffling uses non-crypto random (S311).
"ml/**" = ["E501", "S311", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
namespace_packages = true
# Type-check shippable source under src/. Test files are excluded from the strict gate:
# with hyphenated package directories (dula-ai, ai-gateway) their duplicate basenames
# (conftest.py, test_health.py) cannot form unique module paths. Tests are validated by
# ruff + pytest instead.
exclude = ["(^|/)(\\.venv|build|dist|alembic)/", "(^|/)tests/"]

[[tool.mypy.overrides]]
# aiokafka ships no type information (no py.typed); we isolate the untyped import at the
# single call site in dula_common.events and treat its surface as Any.
module = ["aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# qdrant-client / opensearch-py are lazy-imported inside store adapters; their type surface
# is treated as Any (isolated to dula_ai.stores).
module = ["qdrant_client.*", "opensearchpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# importlib mode lets test files with the same basename live in different package test dirs
# (e.g. multiple conftest.py / test_health.py) without collection clashes.
addopts = "-q --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["packages", "services", "apps", "tests"]
