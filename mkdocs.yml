      - Project structure: 01-Project/ProjectStructure.md
      - Technology stack: 01-Project/TechnologyStack.md
      - Dependencies: 01-Project/Dependencies.md
      - API standards: 12-API/APIStandards.md
      - Core domain API: 12-API/CoreDomainAPI.md
      - AI Gateway API: 12-API/AIGatewayAPI.md
      - Agents API: 12-API/AgentsAPI.md
      - Automation API: 12-API/AutomationAPI.md
      - Integrations API: 12-API/IntegrationsAPI.md
