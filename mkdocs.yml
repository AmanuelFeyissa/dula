# Dula documentation site (MkDocs Material). Builds a static, offline-capable site from the
# existing docs/ tree — no content duplication. Build: `uv run --group docs mkdocs build`.
site_name: Dula
site_description: Dula — a cybersecurity AI ecosystem (platform + cybersecurity-specialized AI).
site_author: Dula
site_url: https://amanuelfeyissa.github.io/dula/
copyright: Apache-2.0 licensed. Dula is a defensive cybersecurity AI ecosystem.

repo_name: AmanuelFeyissa/dula
repo_url: https://github.com/AmanuelFeyissa/dula
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    logo: material/shield-check
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# Many engineering docs link to repo-root files (CLAUDE.md, the top-level README) that live
# outside the published site; those resolve on GitHub but not here, so downgrade rather than fail.
# In-site relative links are still validated by tools/check-doc-links.sh (CLAUDE.md §9).
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: info
    unrecognized_links: info

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AmanuelFeyissa/dula

# Not every file in docs/ appears in the curated journey below; the rest still build and remain
# reachable via search and cross-links.
not_in_nav: |
  /PROJECT_REVIEW-M000.md
  /SUMMARY.md

