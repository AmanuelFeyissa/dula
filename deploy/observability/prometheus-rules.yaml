apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dula-slo-rules
  labels:
    app.kubernetes.io/part-of: dula
    role: alert-rules
  annotations:
    description: >-
      Dula SLO recording + alerting rules (docs/16-Operations/Observability.md).
      Infra-signal alerts (target down, crashloop, HPA saturation) fire today; the
      request-level SLI rules attach when the application Prometheus exporter lands (FUTURE).
spec:
  groups:
    - name: dula.availability
      rules:
        # Recording rule: rollup of container restarts per component (real today).
        - record: dula:container_restarts:rate5m
          expr: sum by (namespace, pod) (rate(kube_pod_container_status_restarts_total{namespace=~"dula.*"}[5m]))
        - alert: DulaTargetDown
          expr: up{namespace=~"dula.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Dula target {{ $labels.job }} is down"
            description: "A Dula scrape target has been down for 5m."
        - alert: DulaPodCrashLooping
          expr: dula:container_restarts:rate5m > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container restarts observed over 15m in {{ $labels.namespace }}."
        - alert: DulaHPASaturated
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace=~"dula.*"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=~"dula.*"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} at max replicas"
            description: "Sustained saturation — review capacity/sizing."
    - name: dula.slo.requests
      # FUTURE: attaches to the application /metrics exporter (http_request_* histograms).
      # SLO targets: availability >= 99.5%, p95 latency < 800ms (docs/16-Operations/Observability.md).
      rules:
        - alert: DulaHighErrorRate
          expr: |
            sum by (service) (rate(http_requests_total{namespace=~"dula.*",code=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total{namespace=~"dula.*"}[5m])) > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }} 5xx rate > 5%"
            description: "Error budget burning; investigate {{ $labels.service }}."
    - name: dula.mlops.canary
      # Model rollout monitoring (docs/09-MLOps/ModelLifecycle.md #3, M011 PR C).
      #
      # The REAL, working drift-detection + auto-rollback trigger today is
      # ml/dula_train/monitor.py, run on a schedule by
      # deploy/argo/dula-ai-monitor-cronworkflow.yaml -- it reuses the same evaluation gate a
      # new candidate is judged by, and appends a registry rollback transition on regression
      # (dula_ml.lifecycle.rollback). That job's pass/fail is visible via
      # `kubectl get workflows -l app.kubernetes.io/component=mlops` / the Argo UI, not
      # Prometheus, because this project's Helm chart doesn't operate the Argo Workflow
      # controller (it's an external cluster dependency, like Postgres/Qdrant) and this
      # repo's own request-level metrics (canary vs production latency/error-rate deltas
      # per request) need the application /metrics exporter, which does not exist yet
      # (tracked in PROJECT_STATE.md's "remaining non-blocking items", same gap
      # dula.slo.requests above already documents). The rule below is real once that exporter
      # lands, provided it emits a `provider` *role* label with exactly the values
      # "candidate"/"production" -- not the raw Usage.routed_provider provider name (e.g.
      # "openai-compat-dula-ai-v2"), which the exporter must map to a role by comparing it
      # against the currently-configured canary_candidate_model/production provider name at
      # export time (packages/dula-ai/src/dula_ai/providers.py).
      rules:
        - alert: DulaCanaryRegression
          expr: |
            sum by (service) (rate(ai_call_errors_total{namespace=~"dula.*",provider="candidate"}[15m]))
            / sum by (service) (rate(ai_call_total{namespace=~"dula.*",provider="candidate"}[15m]))
            >
            sum by (service) (rate(ai_call_errors_total{namespace=~"dula.*",provider="production"}[15m]))
            / sum by (service) (rate(ai_call_total{namespace=~"dula.*",provider="production"}[15m]))
            * 1.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} canary error rate exceeds production by 50%+"
            description: >-
              Candidate is regressing relative to production over the last 15m; consider
              lowering canary_weight or running ml/dula_train/monitor.py to check the gate.
