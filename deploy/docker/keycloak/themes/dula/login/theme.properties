# Dula login theme.
#
# Keycloak serves the sign-in page, so the page must look like Dula rather than like an
# identity vendor. Theming (not replacing) the page is what keeps PKCE, brute-force lockout
# and future MFA/WebAuthn working — see docs/adr/ADR-0009-authentication-authorization.md.
#
# parent=keycloak.v2 is the shipped default login theme in Keycloak 26 (verified against
# quay.io/keycloak/keycloak:26.0 via /admin/serverinfo, which lists: base, keycloak,
# keycloak.v2). It is built on PatternFly v5, so the overrides in css/dula.css target
# .pf-v5-c-* classes.
parent=keycloak.v2
import=common/keycloak

# `styles` REPLACES the parent's list rather than extending it, so the parent's own
# css/styles.css has to be repeated here or the PatternFly layout is lost. Order matters:
# tokens first, then our overrides last so they win.
styles=css/styles.css css/tokens.css css/dula.css
