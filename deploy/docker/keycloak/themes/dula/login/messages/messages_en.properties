# Copy overrides for the Dula login theme.
#
# Keys are inherited from theme/base/login/messages/messages_en.properties; only the strings a
# Dula operator would actually read are changed here. The goal is that nothing on the page
# reads as generic identity-vendor boilerplate.
#
# Keycloak reads .properties as ISO-8859-1 unless escaped, so keep these ASCII-only.

loginAccountTitle=Sign in to Dula
usernameOrEmail=Username or email
doLogIn=Sign in
doForgotPassword=Forgot your password?
