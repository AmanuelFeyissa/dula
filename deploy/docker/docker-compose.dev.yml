# Dula — local development stack (Docker Compose).
# Brings up the SAME components used in production, at small scale (docs/11-Deployment/LocalDevelopment.md).
# Usage (from repo root):  docker compose -f deploy/docker/docker-compose.dev.yml --env-file .env up -d
#
# NOTE: image tags here are dev-stack defaults. Run `docker compose ... pull` to verify them,
# and pin exact digests during Phase 01 hardening (docs/10-Security/SupplyChainSecurity.md).
# These credentials are LOCAL-DEV ONLY; production secrets come from Vault.

name: dula-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dula_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dula}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dula} -d ${POSTGRES_DB:-dula}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST/gRPC
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"   # dev only; TLS/auth enabled in real deployments
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-Dula_dev_Admin123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dula}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dula_dev_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"   # Kafka API (host)
      - "9644:9644"     # admin API
    volumes:
      - redpandadata:/var/lib/redpanda/data

  opa:
    image: openpolicyagent/opa:0.68.0
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=error"
      - "/policies"
    ports:
      - "8181:8181"   # OPA Data API
    volumes:
      - ../opa/policy:/policies:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

volumes:
  pgdata:
  qdrantdata:
  osdata:
  miniodata:
  redpandadata:
