{{- if .Values.metrics.enabled }}
{{- $root := . -}}
# Prometheus scrape config (Prometheus operator CRD). platform-api and ai-gateway serve
# /metrics (dula_common.metrics: http_request_* + ai_call_* series); the worker has no HTTP
# port, so its scrape target is inert (docs/16-Operations/Observability.md).
{{- range $name, $c := .Values.components }}
{{- if and $c.enabled $c.service $c.service.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "dula.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    matchLabels:
      {{- include "dula.selectorLabels" (dict "root" $root "name" $name) | nindent 6 }}
  endpoints:
    - port: http
      path: {{ $root.Values.metrics.path }}
      interval: {{ $root.Values.metrics.interval }}
{{- end }}
{{- end }}
{{- end }}
