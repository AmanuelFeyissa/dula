{{- $root := . -}}
{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "dula.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not (and $c.hpa $c.hpa.enabled) }}
  replicas: {{ $c.replicas | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dula.selectorLabels" (dict "root" $root "name" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "dula.selectorLabels" (dict "root" $root "name" $name) | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $root.Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ include "dula.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $c.gpu $c.gpu.enabled $c.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml $c.gpu.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if and $c.gpu $c.gpu.enabled $c.gpu.tolerations }}
      tolerations:
        {{- toYaml $c.gpu.tolerations | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "dula.image" (dict "root" $root "c" $c) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- with $c.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          {{- if $c.port }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $root.Release.Name }}-config
            - secretRef:
                name: {{ $root.Values.existingSecret }}
                optional: true
          {{- with $c.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and $c.probes $c.probes.enabled }}
          {{- if and $c.probes.startup $c.probes.startup.enabled }}
          startupProbe:
            # Disables liveness/readiness checks until this succeeds -- for slow-starting
            # containers (e.g. `serving` loading a multi-GB checkpoint) so kubelet doesn't kill
            # the pod mid-load using timings tuned for fast-starting web services.
            httpGet:
              path: {{ $c.probes.startupPath | default $c.probes.path | default "/" }}
              port: http
            periodSeconds: {{ $c.probes.startup.periodSeconds | default 10 }}
            failureThreshold: {{ $c.probes.startup.failureThreshold | default 30 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $c.probes.livenessPath | default $c.probes.path | default "/" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $c.probes.readinessPath | default $c.probes.path | default "/" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $name "web" }}
            - name: cache
              mountPath: /app/apps/web/.next/cache
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "web" }}
        - name: cache
          emptyDir: {}
        {{- end }}
{{- end }}
{{- end }}
