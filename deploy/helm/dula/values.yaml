# Default values for the Dula umbrella chart.
#
# These defaults describe a hardened production deployment. Profile overlays
# (values-cloud/onprem/hybrid/airgapped.yaml) change only what differs; the base
# stays identical (one codebase, profiles via values — ADR-0011, DeploymentArchitecture.md).
#
# Security posture (enforced at admission by Kyverno, ADR-0015): every workload runs
# non-root, read-only root filesystem, all capabilities dropped, seccomp RuntimeDefault,
# with resource limits. Images should be pinned by digest in production overlays.

global:
  # Registry that holds the mirrored, signed images. In air-gapped installs this is the
  # private in-cluster/registry mirror; nothing is pulled from the public internet.
  imageRegistry: ghcr.io/amanuelfeyissa
  imageTag: "0.1.0" # overridden by @sha256 digest in production overlays
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# Non-secret configuration, injected into every component via envFrom (a ConfigMap).
# Pydantic settings match env names case-insensitively by field name.
config:
  LOG_LEVEL: "INFO"
  KEYCLOAK_URL: "http://keycloak.dula-system.svc:8080"
  KEYCLOAK_REALM: "dula"
  API_AUDIENCE: "dula-api"
  OPA_URL: "http://opa.dula-system.svc:8181"
  PROFILE: "backed"
  QDRANT_URL: "http://qdrant.dula-data.svc:6333"
  OPENSEARCH_URL: "http://opensearch.dula-data.svc:9200"
  KAFKA_BOOTSTRAP_SERVERS: "redpanda.dula-data.svc:9092"
  EVENTS_ENABLED: "true"
  PROVIDER: "extractive"
  # Air-gapped-first: connector egress is disabled unless a profile explicitly enables it.
  PLUGINS_EGRESS_ENABLED: "false"

# Secrets are never inlined in the chart. Reference an externally-managed Secret
# (Vault CSI / SOPS-decrypted) that carries DATABASE_URL, OPENAI_API_KEY, etc. (ADR-0015).
existingSecret: dula-secrets

serviceAccount:
  create: true
  name: "dula"
  annotations: {}

# Hardened defaults applied to every pod/container unless a component overrides them.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop: ["ALL"]

# Prometheus ServiceMonitor (Phase 09 observability). Requires the Prometheus operator CRDs.
metrics:
  enabled: true
  path: /metrics
  interval: 30s

# NetworkPolicies segment planes with default-deny egress + explicit allowlists (ADR-0014).
networkPolicy:
  enabled: true
  # Extra egress CIDRs allowed cluster-wide (e.g. an on-prem SIEM). Air-gapped keeps this empty.
  allowedEgressCIDRs: []

# North-south edge via Envoy Gateway / Kubernetes Gateway API (ADR-0014).
gateway:
  enabled: true
  className: envoy-gateway
  hostname: dula.example.com
  tls:
    enabled: true
    secretName: dula-tls

# Components. Each renders a Deployment (+ Service/HPA/PDB where applicable).
components:
  web:
    enabled: true
    image: dula/web
    replicas: 2
    port: 3000
    service:
      enabled: true
      port: 80
    route:
      enabled: true
      path: /
    probes:
      enabled: true
      path: /
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPU: 70
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 512Mi }

  platform-api:
    enabled: true
    image: dula/platform-api
    replicas: 2
    port: 8000
    service:
      enabled: true
      port: 8000
    route:
      enabled: true
      path: /api/v1
    probes:
      enabled: true
      livenessPath: /healthz
      readinessPath: /readyz
    migrations:
      enabled: true # runs Alembic as a pre-upgrade Job (forward-only)
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: "1", memory: 768Mi }

  ai-gateway:
    enabled: true
    image: dula/ai-gateway
    replicas: 2
    port: 8100
    service:
      enabled: true
      port: 8100
    route:
      enabled: true
      path: /api/v1/ai
    probes:
      enabled: true
      livenessPath: /healthz
      readinessPath: /readyz
    migrations:
      enabled: true # ADR-0016: agent_runs/agent_run_steps, own migration chain
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: "2", memory: "1.5Gi" }

  worker:
    enabled: true
    image: dula/worker
    replicas: 2
    command: ["python", "-m", "dula_worker.main"]
    service:
      enabled: false
    route:
      enabled: false
    probes:
      enabled: false # background consumer, no HTTP surface
    hpa:
      enabled: false
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 512Mi }

  # GPU model-serving pool (Phase 10/M011, ADR-0005): vLLM behind the LLM Gateway's
  # OpenAICompatProvider -- no gateway-side code change is needed to point at this, and
  # CanaryProvider (M011 PR B) can route a fraction of traffic to a second instance of this
  # same component (a separate release, or a distinct `serving-candidate` copy of these values).
  #
  # Disabled by default: no Dula AI checkpoint has shipped yet (the Phase 04 candidate was
  # retired by the eval gate). Flip `enabled: true` and replace the model in `command` once one
  # does (M011 PR E). Air-gapped/CPU-only installs should instead point apps/ai-gateway's
  # PROVIDER at "extractive" (the default, already the case in values-airgapped.yaml) or an
  # in-cluster llama.cpp server with `gpu.enabled: false` and no GPU resources/scheduling --
  # this component's `image`/`command`/`gpu`/`resources` are all just values, not template logic,
  # so an llama.cpp variant is a values-only change, no chart change.
  serving:
    enabled: false
    image: vllm-openai # mirror upstream vllm/vllm-openai into global.imageRegistry (ADR-0015) --
    # every component here is expected pre-mirrored/signed, never pulled directly, air-gapped or not.
    replicas: 1
    port: 8000
    command:
      - "vllm"
      - "serve"
      # RECOMMENDED: a path to weights pre-staged onto a mounted volume (a separate,
      # egress-allowed job/CI step syncs the HF Hub artifact ahead of time), not a bare HF
      # model ID -- this pod runs under the namespace's default-deny-egress NetworkPolicy
      # (templates/networkpolicy.yaml) like every other component, so a bare model ID (which
      # `vllm serve` would try to download from huggingface.co at startup) hangs/crash-loops
      # unless the operator also adds an explicit `networkPolicy.allowedEgressCIDRs` entry for
      # it. Pre-staging keeps this component consistent with the chart's "nothing pulled from
      # the public internet" posture (see `image` above) instead of being the one exception.
      - "REPLACE_WITH_MOUNTED_MODEL_PATH_OR_HF_MODEL_ID"
      - "--served-model-name"
      - "dula-ai"
      - "--port"
      - "8000"
    service:
      enabled: true
      port: 8000
    route:
      enabled: false # internal only -- reached via the ai-gateway's openai_base_url (ClusterIP),
      # never the public edge.
    probes:
      enabled: true
      path: /health
      startup:
        # A multi-GB checkpoint can take minutes to load; without this, the fast startupProbe-
        # free liveness timings tuned for web services (readinessProbe below) would kill the
        # pod mid-load, forever.
        enabled: true
        periodSeconds: 10
        failureThreshold: 60 # up to ~10 minutes before the pod is considered stuck
    # vLLM/PyTorch/Triton write to several cache dirs, none of which are /tmp (the only
    # writable mount every component gets) by default -- containerSecurityContext.
    # readOnlyRootFilesystem is a global default (podSecurityContext/containerSecurityContext
    # apply uniformly, no per-component override in this chart), so without redirecting all of
    # them the pod would crash-loop the first time it downloads a model or JIT-compiles a
    # kernel.
    env:
      - name: HF_HOME
        value: /tmp/hf-cache
      - name: XDG_CACHE_HOME
        value: /tmp/xdg-cache
      - name: TRITON_CACHE_DIR
        value: /tmp/triton-cache
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/inductor-cache
    hpa:
      enabled: false # GPU pools are pre-provisioned/fixed-size, not CPU-scaled.
    pdb:
      enabled: false # single replica by default; a PDB here would block all voluntary eviction.
    gpu:
      enabled: true
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    resources:
      requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: 1 }
