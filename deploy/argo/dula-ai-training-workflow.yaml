# Argo Workflows manifest for the Dula AI training pipeline (ADR-0010).
# Declarative pipeline: prepare -> train (GPU) -> eval candidate + baseline -> decide.
# This is the production/cluster form of the same steps runnable locally via `ml/dvc.yaml`.
# Apply on a cluster with Argo Workflows + a GPU node pool; images are built from the ml/ project.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dula-ai-training
  labels:
    app.kubernetes.io/part-of: dula
    app.kubernetes.io/component: mlops
spec:
  entrypoint: train-eval-decide
  arguments:
    parameters:
      - name: base-model
        value: "Qwen/Qwen2.5-3B-Instruct"
      - name: image
        value: "ghcr.io/amanuelfeyissa/dula-ml:latest" # built from ml/ + packages/dula-ml
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  templates:
    - name: train-eval-decide
      steps:
        - - name: prepare
            template: step
            arguments:
              parameters: [{ name: cmd, value: "python -m dula_train.data_prep --out ml/data" }]
        - - name: train
            template: gpu-step
            arguments:
              parameters: [{ name: cmd, value: "python -m dula_train.train_qlora" }]
        - - name: eval-candidate
            template: gpu-step
            arguments:
              parameters:
                [{ name: cmd, value: "python -m dula_train.eval_runner --model out/dula-qlora --label candidate --out out/candidate.json" }]
          - name: eval-baseline
            template: gpu-step
            arguments:
              parameters:
                [{ name: cmd, value: "python -m dula_train.eval_runner --model {{workflow.parameters.base-model}} --label baseline --out out/baseline.json" }]
        - - name: decide
            template: step
            arguments:
              parameters:
                [{ name: cmd, value: "python -m dula_train.decide --candidate out/candidate.json --baseline out/baseline.json --manifest out/registry.jsonl --card-out out/model_card.md" }]
        # `decide` above already *registers* the candidate (docs/09-MLOps/ModelRegistry.md):
        # a manifest entry with decision=ship|retire and no stage. This pipeline intentionally
        # ends there -- promotion through staging/canary/production
        # (ml/dula_train/promote.py, dula_ml.lifecycle, M011 PR A) is a separate,
        # human-triggered step, never auto-run by the training pipeline.

    - name: step
      # Free-tier/transient infra hardening (M011 PR D): retry a couple of times before
      # failing the whole pipeline, and cap runtime so a hang can't burn the GPU quota this
      # shares with gpu-step below.
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
        backoff: { duration: "30s", factor: "2" }
      activeDeadlineSeconds: 3600
      inputs:
        parameters: [{ name: cmd }]
      container:
        image: "{{workflow.parameters.image}}"
        command: ["bash", "-c"]
        args: ["PYTHONPATH=ml {{inputs.parameters.cmd}}"]
        resources:
          requests: { cpu: "1", memory: "2Gi" }
          limits: { cpu: "2", memory: "4Gi" }
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef: { name: huggingface, key: token }
        volumeMounts:
          - { name: work, mountPath: /workspace }

    - name: gpu-step
      # Free-tier GPU runs (Kaggle/Lightning/Modal, ADR-0012) fail transiently more often than
      # dedicated infra (preemption, OOM, flaky downloads) -- retry before failing the whole
      # pipeline, and cap runtime so a hang can't silently consume the whole GPU quota/budget.
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
        backoff: { duration: "30s", factor: "2" }
      activeDeadlineSeconds: 7200
      inputs:
        parameters: [{ name: cmd }]
      container:
        image: "{{workflow.parameters.image}}"
        command: ["bash", "-c"]
        args: ["PYTHONPATH=ml {{inputs.parameters.cmd}}"]
        resources:
          requests: { cpu: "2", memory: "8Gi" }
          limits: { cpu: "4", memory: "16Gi", nvidia.com/gpu: 1 }
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef: { name: huggingface, key: token }
        volumeMounts:
          - { name: work, mountPath: /workspace }
