name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (link check + naming)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relative-link check
        run: bash tools/check-doc-links.sh
      - name: No old placeholder names
        run: |
          # Old codenames must not reappear as product identifiers. The ADR that records the
          # rename and the guardrail files that mention them by name are allowlisted.
          matches=$(grep -rn --exclude-dir=.git 'Aegis\|SecLLM' . \
            | grep -vE 'docs/adr/ADR-0001-product-naming\.md|(^|/)CLAUDE\.md|(^|/)Makefile|\.github/workflows/ci\.yml' \
            || true)
          if [ -n "$matches" ]; then
            echo "$matches"; echo "Found forbidden placeholder names."; exit 1
          fi
          echo "Naming check passed."

  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy, strict)
        run: uv run mypy packages apps
      - name: Tests (pytest)
        run: uv run pytest

  web:
    name: Web (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web (runs lint + type-check via next build)
        env:
          AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
        run: pnpm --filter web build

  security:
    name: Security (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
