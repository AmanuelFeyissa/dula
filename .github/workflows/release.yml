# Release / supply-chain pipeline (ADR-0015). Builds, SBOMs, scans, and cosign-signs the Dula
# images, then pushes them by digest. Runs ONLY on a version tag or manual dispatch — never on
# PRs — so day-to-day CI stays fast. Signing/pushing require registry + signing-key secrets that
# are configured for the release environment; without them the build/SBOM/scan steps still run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/amanuelfeyissa

jobs:
  images:
    name: Build + SBOM + scan + sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [web, platform-api, ai-gateway, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          tags: ${{ env.REGISTRY }}/dula/${{ matrix.component }}:${{ steps.ver.outputs.version }}
          load: true

      - name: Generate SBOM (syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/dula/${{ matrix.component }}:${{ steps.ver.outputs.version }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Vulnerability scan (grype — fail on fixable High/Critical)
        uses: anchore/scan-action@v5
        with:
          image: ${{ env.REGISTRY }}/dula/${{ matrix.component }}:${{ steps.ver.outputs.version }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      # Signing + push require secrets configured for the release environment (COSIGN_KEY,
      # registry auth). Skipped automatically when they are absent so the build/SBOM/scan
      # steps above still validate the release.
      - name: Install cosign
        if: ${{ secrets.COSIGN_KEY != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Log in to registry
        if: ${{ secrets.COSIGN_KEY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, sign (keyed), and attest SBOM + SLSA provenance
        if: ${{ secrets.COSIGN_KEY != '' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          img="${REGISTRY}/dula/${{ matrix.component }}:${{ steps.ver.outputs.version }}"
          docker push "$img"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$img")"
          cosign sign --key env://COSIGN_KEY --yes "$digest"
          cosign attest --key env://COSIGN_KEY --yes \
            --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "$digest"
